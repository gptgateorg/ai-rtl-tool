<!doctype html>
<html lang="fa" dir="rtl" data-motion="instant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ابزار فارسی GptGate</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="popup-header">
      <div class="brand">
        <img src="images/logo.png" width="40" height="40" alt="" />
        <div><h1><bdi>GptGate</bdi></h1><p>برای متن فارسی و انگلیسی</p></div>
      </div>
      <div class="theme-switcher" data-motion="instant">
        <button id="themeToggle" class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="نمای تیرهٔ افزونه" title="نمای تیرهٔ افزونه">
          <span class="theme-toggle-thumb" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <defs><mask id="theme-moon-mask"><rect width="24" height="24" fill="white"/><circle class="theme-moon-cutout" cx="16" cy="9" r="7" fill="black"/></mask></defs>
              <circle class="theme-sun-disc" cx="12" cy="12" r="7" fill="currentColor" mask="url(#theme-moon-mask)"/>
              <g class="theme-sun-rays" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1v2M12 21v2M1 12h2M21 12h2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></g>
            </svg>
          </span>
        </button>
      </div>
    </header>
    <main>
      <fieldset id="settings" disabled aria-busy="true">
        <legend class="sr-only">تنظیمات متن فارسی</legend>
        <section class="panel direction-panel" aria-labelledby="directionHeading">
          <h2 id="directionHeading" class="sr-only">جهت متن</h2>
          <div class="direction-setting">
            <div class="setting-heading"><h3 id="responseLabel">پاسخ‌های هوش مصنوعی</h3></div>
            <div class="seg" role="group" aria-labelledby="responseLabel" data-motion="instant">
              <button type="button" class="seg-btn" id="respLtr" data-key="responseDir" data-val="ltr" title="چپ‌چین، مناسب متن انگلیسی" aria-pressed="false">چپ‌چین</button>
              <button type="button" class="seg-btn" id="respAuto" data-key="responseDir" data-val="auto" title="تشخیص جهت هر پاراگراف" aria-pressed="false">خودکار</button>
              <button type="button" class="seg-btn" id="respRtl" data-key="responseDir" data-val="rtl" title="راست‌چین، مناسب متن فارسی" aria-pressed="false">راست‌چین</button>
            </div>
          </div>
          <div class="direction-setting">
            <div class="setting-heading"><h3 id="composerLabel">کادر نوشتن پیام</h3></div>
            <div class="seg" role="group" aria-labelledby="composerLabel" data-motion="instant">
              <button type="button" class="seg-btn" id="compLtr" data-key="composerDir" data-val="ltr" title="چپ‌چین" aria-pressed="false">چپ‌چین</button>
              <button type="button" class="seg-btn" id="compAuto" data-key="composerDir" data-val="auto" title="تشخیص خودکار فارسی و انگلیسی" aria-pressed="false">خودکار</button>
              <button type="button" class="seg-btn" id="compRtl" data-key="composerDir" data-val="rtl" title="راست‌چین" aria-pressed="false">راست‌چین</button>
            </div>
          </div>
        </section>
        <section class="panel reading-panel" aria-labelledby="readingHeading">
          <h2 id="readingHeading" class="sr-only">خواندن راحت‌تر</h2>
          <div class="control-row">
            <div class="control-copy"><label for="mathSwitch">اصلاح فرمول‌های ریاضی</label><small id="mathDescription">ترتیب درست عددها و علامت‌ها</small></div>
            <label class="switch" data-motion="instant"><input type="checkbox" id="mathSwitch" data-key="mathFix" aria-describedby="mathDescription" /><span class="slider" aria-hidden="true"></span></label>
          </div>
          <div class="control-row">
            <div class="control-copy"><label for="fontSwitch">فونت فارسی ایران‌سنس</label><small id="fontDescription">خواناتر شدن متن‌های راست‌چین</small></div>
            <label class="switch" data-motion="instant"><input type="checkbox" id="fontSwitch" data-key="fontFix" aria-describedby="fontDescription" /><span class="slider" aria-hidden="true"></span></label>
          </div>
          <div class="control-row" id="claudeThemeRow" hidden>
            <div class="control-copy"><label for="claudeThemeSwitch">پس‌زمینهٔ مشکی Claude</label><small id="claudeDescription">گزینهٔ نمایش مخصوص سایت Claude</small></div>
            <label class="switch" data-motion="instant"><input type="checkbox" id="claudeThemeSwitch" data-key="claudeDarkSurface" aria-describedby="claudeDescription" /><span class="slider" aria-hidden="true"></span></label>
          </div>
        </section>
      </fieldset>
      <div class="status-row" role="status" aria-live="polite" aria-atomic="true">
        <span class="status-dot" id="statusDot" aria-hidden="true"></span>
        <span id="status">در حال خواندن تنظیمات…</span>
        <button id="retryBtn" type="button" hidden>تلاش دوباره</button>
      </div>
    </main>
    <footer>
      <button id="ctaBtn" type="button" class="community-link" aria-label="کانال تلگرام GptGate">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 3-4 18-6-6-4 3 1-6L3 10 21 3Z"/><path d="m8 12 9-6-6 9"/></svg>
        <span>تلگرام GptGate</span>
      </button>
      <span id="versionText" dir="ltr"></span>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
